<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="70mm" viewBox="0 0 1800 700" role="img" aria-labelledby="title description">
<title id="title">HybridGuard: current-record evaluation and offline construction</title>
<desc id="description">Offline selection uses candidate checks and development data under alarm, coverage, and complexity constraints to supply frozen rules. Current App observations, with an optional linked Browser, are associated by value, status, and provenance. Selected checks include single-view predicates, Native-Web memory and timezone relations, and optional C1 timezone comparison. The ordered decision tests are: an empty selected set yields EMPTY_MODEL; a required execution or binding failure yields FAILED; otherwise any T yields ALERT, all F yields NO ALERT, and every remaining case yields UNKNOWN. T means a triggered predicate, F a definite non-trigger, U unknown, and FAILED a relevant execution or association failure. App-only and App-plus-linked-Browser are alternative configurations, not a fallback sequence. Only current observations are evaluated. Host geometry is not included in the integrated detector.</desc>
<style>text{font-family:"Nimbus Roman","Times New Roman",Times,serif; fill:#343434}</style>
