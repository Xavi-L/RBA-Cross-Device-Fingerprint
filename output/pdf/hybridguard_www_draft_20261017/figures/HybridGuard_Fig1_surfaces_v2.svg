<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="126mm" height="56mm" viewBox="0 0 1260 560" role="img" aria-labelledby="title desc">
<title id="title">HybridGuard observation surfaces and comparison boundaries</title>
<desc id="desc">Native APIs, App Web JavaScript, and WebView Host form a triangle within one App execution. The solid blue memory and timezone relation is integrated; the dashed ochre Host geometry relation is a standalone study; the dotted Native to Host line is shared context only. An external Browser is a separate execution and supplies an optional linked C1 timezone comparison. Schema field counts are 84, 67, 26 and 67, respectively, and are not all detector inputs. No observation surface is trusted ground truth. Connectors denote comparison, not communication or attestation.</desc>
<style>text {font-family:"Nimbus Roman","Times New Roman",Times,serif} .body{font-size:28px;fill:#343434} .node-title{font-size:31px;font-weight:bold;fill:#343434}</style>

<defs>
<marker id="compare-selected" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2L10 6.5L2 11" stroke="#507cc4" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker>
<marker id="compare-studied" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2L10 6.5L2 11" stroke="#bd8b47" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker>
</defs>
<rect width="1260" height="560" fill="white" />
<g id="app-observations" data-kind="inside-app-scope">
