</g>
<g id="host-app-web" data-kind="relation" data-source="webview-host" data-target="app-web" data-status="studied">
<path d="M510 376V168" stroke="#bd8b47" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7" marker-start="url(#compare-studied)" marker-end="url(#compare-studied)" />
</g>
