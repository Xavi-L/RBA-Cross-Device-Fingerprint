<text x="36" y="38" font-size="31" font-weight="bold" fill="#343434">Same app execution</text>
<g id="core-action">
<text x="36" y="88" font-size="32" font-weight="bold" fill="#A14D48">Cross-check</text>
<text x="36" y="122" class="body">Web reports</text>
</g>
