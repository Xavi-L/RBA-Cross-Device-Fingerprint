<text x="826" y="249" font-size="29" fill="#3d756c" font-weight="400" text-anchor="middle" font-style="italic">a</text>
<path d="M855 240L966 240" fill="none" stroke="#3d756c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<text x="1003" y="249" font-size="29" fill="#3d756c" font-weight="400" text-anchor="middle" font-style="italic">b</text>
