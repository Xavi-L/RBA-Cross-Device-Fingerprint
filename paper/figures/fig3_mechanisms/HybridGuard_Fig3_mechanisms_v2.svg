<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="62mm" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
<title id="title">HybridGuard: three mechanisms of contextual integrity evidence</title>
<desc id="desc">Three schematic panels explain the value of references, not measured outcomes. A synthetic Native memory of 4 GiB and Web report of 8 GiB do not trigger a global greater-than-8 check, but violate the Native-derived 4 GiB envelope. Normal timezone changes move Native and Web effective offsets together after sign normalization; a Web-only edit changes only the Web offset. The Host geometry specialist compares viewport dimensions after conversion against a container bound; it remains a standalone study outside the integrated detector. All examples assume valid, applicable observations.</desc>
<style>text{font-family:"Nimbus Roman","Times New Roman",Times,serif}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 4L1 7Z" fill="#507cc4"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 4L1 7Z" fill="#bd8b47"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 4L1 7Z" fill="#687078"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 4L1 7Z" fill="#3d756c"/></marker>
</defs><rect width="1800" height="620" fill="white"/>
<path d="M600 18L600 563" fill="none" stroke="#d5d9df" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1200 18L1200 563" fill="none" stroke="#d5d9df" stroke-width="1.8" stroke-linecap="round"/>
<g id="device-context">
<text x="30" y="46" font-size="33" fill="#343434" font-weight="700" text-anchor="start">(a) Device context</text>
<text x="30" y="90" font-size="27" fill="#687078" font-weight="400" text-anchor="start">Native: 4 GiB   ·   Web: 8 GiB</text>
<text x="30" y="147" font-size="29" fill="#343434" font-weight="700" text-anchor="start">Global threshold</text>
<path d="M76 210L535 210" fill="none" stroke="#d5d9df" stroke-width="2.2" stroke-linecap="round"/>
<path d="M480 171L480 237" fill="none" stroke="#687078" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<circle cx="480" cy="210" r="8.5" fill="#bd8b47" stroke="#bd8b47" stroke-width="2.2"/>
<text x="480" y="170" font-size="26" fill="#687078" font-weight="400" text-anchor="middle">8 GiB limit</text>
<text x="480" y="266" font-size="26" fill="#bd8b47" font-weight="400" text-anchor="middle">Web 8 GiB</text>
<text x="30" y="271" font-size="28" fill="#687078" font-weight="400" text-anchor="start">8 = 8: no trigger</text>
<text x="30" y="330" font-size="29" fill="#343434" font-weight="700" text-anchor="start">Native-derived envelope</text>
<path d="M76 390L535 390" fill="none" stroke="#d5d9df" stroke-width="2.2" stroke-linecap="round"/>
<path d="M278 371L278 422" fill="none" stroke="#507cc4" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="480" cy="390" r="8.5" fill="#bd8b47" stroke="#bd8b47" stroke-width="2.2"/>
<text x="278" y="356" font-size="26" fill="#507cc4" font-weight="400" text-anchor="middle">4 GiB bound</text>
<text x="480" y="438" font-size="26" fill="#bd8b47" font-weight="400" text-anchor="middle">Web 8 GiB</text>
<text x="30" y="481" font-size="28" fill="#bd8b47" font-weight="700" text-anchor="start">8 &gt; 4: trigger</text>
<text x="300" y="550" font-size="27" fill="#343434" font-weight="700" text-anchor="middle">Plausible alone, incompatible together</text>
</g>
<g id="legitimate-cochange">
<text x="630" y="46" font-size="33" fill="#343434" font-weight="700" text-anchor="start">(b) Legitimate co-change</text>
<text x="630" y="90" font-size="27" fill="#687078" font-weight="400" text-anchor="start">Offsets in the same sign convention</text>
<text x="630" y="147" font-size="29" fill="#3d756c" font-weight="700" text-anchor="start">Normal system change</text>
<text x="647" y="199" font-size="28" fill="#343434" font-weight="400" text-anchor="start">Native</text>
<text x="826" y="199" font-size="29" fill="#3d756c" font-weight="400" text-anchor="middle" font-style="italic">a</text>
