<text x="1492.5" y="470" font-size="26" fill="#bd8b47" font-weight="400" text-anchor="middle">Viewport size P</text>
<text x="1500" y="512" font-size="29" fill="#bd8b47" font-weight="700" text-anchor="middle">P &gt; H + ε: trigger</text>
<text x="1500" y="550" font-size="27" fill="#343434" font-weight="700" text-anchor="middle">Check dimensions against the container</text>
</g>
<path d="M30 578L1770 578" fill="none" stroke="#d5d9df" stroke-width="1.4" stroke-linecap="round"/>
<text x="900" y="609" font-size="25" fill="#687078" font-weight="400" text-anchor="middle">Illustrative examples on valid, applicable inputs; quantitative results are reported separately.</text>
