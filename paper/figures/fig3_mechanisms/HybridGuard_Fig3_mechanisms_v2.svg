<path d="M1058 180L1058 252" fill="none" stroke="#3d756c" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1040 252L1058 252" fill="none" stroke="#3d756c" stroke-width="1.8" stroke-linecap="round"/>
<text x="1082" y="226" font-size="27" fill="#3d756c" font-weight="400" text-anchor="start">match</text>
<text x="630" y="330" font-size="29" fill="#bd8b47" font-weight="700" text-anchor="start">Web-only edit</text>
<text x="647" y="382" font-size="28" fill="#343434" font-weight="400" text-anchor="start">Native</text>
<text x="826" y="382" font-size="29" fill="#687078" font-weight="400" text-anchor="middle" font-style="italic">a</text>
<path d="M855 373L966 373" fill="none" stroke="#687078" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="1003" y="382" font-size="29" fill="#687078" font-weight="400" text-anchor="middle" font-style="italic">a</text>
<text x="647" y="432" font-size="28" fill="#343434" font-weight="400" text-anchor="start">Web</text>
<text x="826" y="432" font-size="29" fill="#bd8b47" font-weight="400" text-anchor="middle" font-style="italic">a</text>
<path d="M855 423L966 423" fill="none" stroke="#bd8b47" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<text x="1003" y="432" font-size="29" fill="#bd8b47" font-weight="400" text-anchor="middle" font-style="italic">b</text>
<path d="M1040 363L1058 363" fill="none" stroke="#bd8b47" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1058 363L1058 435" fill="none" stroke="#bd8b47" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1040 435L1058 435" fill="none" stroke="#bd8b47" stroke-width="1.8" stroke-linecap="round"/>
<text x="1082" y="409" font-size="27" fill="#bd8b47" font-weight="400" text-anchor="start">differ</text>
<text x="900" y="481" font-size="26" fill="#687078" font-weight="400" text-anchor="middle">Distinct offsets a and b illustrate the two cases.</text>
<text x="900" y="550" font-size="27" fill="#343434" font-weight="700" text-anchor="middle">Separate co-change from a local edit</text>
</g>
<g id="container-context">
<text x="1230" y="46" font-size="33" fill="#343434" font-weight="700" text-anchor="start">(c) Container context</text>
<text x="1230" y="90" font-size="28" fill="#bd8b47" font-weight="700" text-anchor="start">Standalone study</text>
<text x="1280" y="149" font-size="28" fill="#507cc4" font-weight="700" text-anchor="start">Host View</text>
