<svg xmlns="http://www.w3.org/2000/svg" width="86mm" height="40.3mm" viewBox="0 0 860 403">
<title>Detection added by the accepted cross-endpoint timezone check</title>
<desc>Four intervention categories compare Full App (hollow gray circle, upper marker) with App + C1 (filled gray-green square, lower marker). Every point reports T/N. Both methods have 0/46 normal alarms, reported separately in the caption. Counts hold separately across three frozen configurations.</desc>
<g font-family="Times New Roman" fill="#343434">
<rect width="860" height="403" fill="#ffffff" data-role="canvas"/>
<circle cx="250" cy="18" r="8.5" fill="#ffffff" stroke="#737A80" stroke-width="2.8" data-role="legend-marker" data-method="APP_FULL"/>
<text x="273" y="28" font-size="31" text-anchor="start" data-role="legend" data-method="APP_FULL">Full App</text>
<rect x="482" y="10" width="16" height="16" fill="#5B8574" data-role="legend-marker" data-method="PAIRED_BASE"/>
<text x="513" y="28" font-size="31" text-anchor="start" data-role="legend" data-method="PAIRED_BASE">App + C1</text>
<line x1="362" y1="48" x2="362" y2="328" stroke="#E1E4E7" stroke-width="1.25" data-role="grid" data-rate="0"/>
<line x1="362" y1="328" x2="362" y2="332" stroke="#9BA2A8" stroke-width="1.5" data-role="tick"/>
<text x="362" y="360" font-size="31" text-anchor="middle" data-role="tick-label" >0</text>
<line x1="591" y1="48" x2="591" y2="328" stroke="#E1E4E7" stroke-width="1.25" data-role="grid" data-rate="50"/>
<line x1="591" y1="328" x2="591" y2="332" stroke="#9BA2A8" stroke-width="1.5" data-role="tick"/>
<text x="591" y="360" font-size="31" text-anchor="middle" data-role="tick-label" >50</text>
<line x1="820" y1="48" x2="820" y2="328" stroke="#E1E4E7" stroke-width="1.25" data-role="grid" data-rate="100"/>
<line x1="820" y1="328" x2="820" y2="332" stroke="#9BA2A8" stroke-width="1.5" data-role="tick"/>
<text x="820" y="360" font-size="31" text-anchor="middle" data-role="tick-label" >100</text>
<line x1="362" y1="328" x2="820" y2="328" stroke="#9BA2A8" stroke-width="1.5" data-role="axis"/>
<text x="591" y="395" font-size="31" text-anchor="middle" data-role="axis-label" >Detection rate (%)</text>
<text x="8" y="84" font-size="31" text-anchor="start" data-role="row-label" data-family="App_language">App language</text>
<text x="8" y="154" font-size="31" text-anchor="start" data-role="row-label" data-family="App_timezone">App timezone</text>
<text x="8" y="224" font-size="31" text-anchor="start" data-role="row-label" data-family="Browser_language">Browser language</text>
<text x="8" y="294" font-size="31" text-anchor="start" data-role="row-label" data-family="Browser_timezone">Browser timezone</text>
<circle cx="362" cy="56.5" r="8.5" fill="#ffffff" stroke="#737A80" stroke-width="2.8" data-role="data-marker" data-point="App_language-APP_FULL" data-method="APP_FULL" data-family="App_language" data-count="0/2" data-rate="0"/>
<text x="385" y="66.5" font-size="31" text-anchor="start" data-role="count" data-point="App_language-APP_FULL" data-method="APP_FULL" data-family="App_language" data-count="0/2" data-rate="0">0/2</text>
<rect x="354" y="83.5" width="16" height="16" fill="#5B8574" data-role="data-marker" data-point="App_language-PAIRED_BASE" data-method="PAIRED_BASE" data-family="App_language" data-count="0/2" data-rate="0"/>
<text x="385" y="101.5" font-size="31" text-anchor="start" data-role="count" data-point="App_language-PAIRED_BASE" data-method="PAIRED_BASE" data-family="App_language" data-count="0/2" data-rate="0">0/2</text>
<circle cx="820" cy="126.5" r="8.5" fill="#ffffff" stroke="#737A80" stroke-width="2.8" data-role="data-marker" data-point="App_timezone-APP_FULL" data-method="APP_FULL" data-family="App_timezone" data-count="2/2" data-rate="100"/>
<text x="797" y="136.5" font-size="31" text-anchor="end" data-role="count" data-point="App_timezone-APP_FULL" data-method="APP_FULL" data-family="App_timezone" data-count="2/2" data-rate="100">2/2</text>
<rect x="812" y="153.5" width="16" height="16" fill="#5B8574" data-role="data-marker" data-point="App_timezone-PAIRED_BASE" data-method="PAIRED_BASE" data-family="App_timezone" data-count="2/2" data-rate="100"/>
<text x="797" y="171.5" font-size="31" text-anchor="end" data-role="count" data-point="App_timezone-PAIRED_BASE" data-method="PAIRED_BASE" data-family="App_timezone" data-count="2/2" data-rate="100">2/2</text>
<circle cx="362" cy="196.5" r="8.5" fill="#ffffff" stroke="#737A80" stroke-width="2.8" data-role="data-marker" data-point="Browser_language-APP_FULL" data-method="APP_FULL" data-family="Browser_language" data-count="0/5" data-rate="0"/>
<text x="385" y="206.5" font-size="31" text-anchor="start" data-role="count" data-point="Browser_language-APP_FULL" data-method="APP_FULL" data-family="Browser_language" data-count="0/5" data-rate="0">0/5</text>
<rect x="354" y="223.5" width="16" height="16" fill="#5B8574" data-role="data-marker" data-point="Browser_language-PAIRED_BASE" data-method="PAIRED_BASE" data-family="Browser_language" data-count="0/5" data-rate="0"/>
<text x="385" y="241.5" font-size="31" text-anchor="start" data-role="count" data-point="Browser_language-PAIRED_BASE" data-method="PAIRED_BASE" data-family="Browser_language" data-count="0/5" data-rate="0">0/5</text>
<circle cx="362" cy="266.5" r="8.5" fill="#ffffff" stroke="#737A80" stroke-width="2.8" data-role="data-marker" data-point="Browser_timezone-APP_FULL" data-method="APP_FULL" data-family="Browser_timezone" data-count="0/5" data-rate="0"/>
<text x="385" y="276.5" font-size="31" text-anchor="start" data-role="count" data-point="Browser_timezone-APP_FULL" data-method="APP_FULL" data-family="Browser_timezone" data-count="0/5" data-rate="0">0/5</text>
<rect x="812" y="293.5" width="16" height="16" fill="#5B8574" data-role="data-marker" data-point="Browser_timezone-PAIRED_BASE" data-method="PAIRED_BASE" data-family="Browser_timezone" data-count="5/5" data-rate="100"/>
<text x="797" y="311.5" font-size="31" text-anchor="end" data-role="count" data-point="Browser_timezone-PAIRED_BASE" data-method="PAIRED_BASE" data-family="Browser_timezone" data-count="5/5" data-rate="100">5/5</text>
</g></svg>
