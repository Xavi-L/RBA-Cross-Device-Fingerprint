<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="66mm" viewBox="0 0 1800 660" role="img" aria-labelledby="title desc">
<title id="title">HybridGuard system design</title>
<desc id="desc">HybridGuard detects evidence of manipulated environment reports. An illustrative memory check uses valid, bound Native and App Web reports of 4 and 8 GiB: the Web report exceeds the 4 GiB upper bound and the check triggers. Current App observations and an optionally linked Browser are associated with their values, field status, and provenance. Fixed selected checks evaluate individual views, Native-Web relations, and an optional App Web-Browser UTC-offset comparison C1. For a nonempty selected set, execution or association errors take priority and produce an execution-failure status without a detection decision. Otherwise any triggered check produces a manipulation alert; all checks untriggered produce no alert; the remaining unresolved cases produce insufficient evidence. Candidate checks and development data independently feed constrained offline rule selection. App-only and App-plus-linked-Browser are alternative configurations. A no-alert result does not establish authenticity or safety.</desc>
<style>text{font-family:"Nimbus Sans","Arial",sans-serif}</style>
