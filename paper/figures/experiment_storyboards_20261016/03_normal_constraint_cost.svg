  <g id="text_36">
   <text style="font-size: 10px; font-family: 'Heiti TC'; fill: #586775" transform="translate(30.996 477.111125)">630条正常约束训练记录另计：有上限三配置报警6 / 6 / 0条、各51条未知；无上限均630/630报警。</text>
   <text style="font-size: 10px; font-family: 'Heiti TC'; fill: #586775" transform="translate(30.996 491.978313)">01/02/03是三个模型分别作用于同一批记录，不合并分母。144＋117是历史评价材料，不是新的盲测。</text>
