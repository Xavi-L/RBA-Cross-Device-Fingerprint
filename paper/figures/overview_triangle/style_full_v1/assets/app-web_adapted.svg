<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="title desc"><title id="title">app-web adapted icon</title><desc id="desc">Three observations in the same app on one device. Solid blue compares Native and App Web; dashed ochre Host–App Web geometry is not in the current detector; dotted gray Native–Host is shared context only and has no arrow. The observations are not trusted ground truth. A review sample only; the rest of the method remains in the unchanged formal figure.</desc><style>text {font-family:'Times New Roman',Times,serif}</style><!-- Adapted Tabler Icons v3.34.1; MIT, Copyright (c) 2020-2024 Pawel Kuna. Full notice and modifications: assets/tabler/LICENSE and assets/SOURCES.md. --><path d="M5 5a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2H7a2 2 0 0 1 -2 -2Z" stroke="#58734f" stroke-width="0.6" fill="white" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3v4a1 1 0 0 0 1 1h4Z" stroke="none" stroke-width="0" fill="#cfddc6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3v4a1 1 0 0 0 1 1h4" stroke="#58734f" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11h8M8 13.5h5.5" stroke="#58734f" stroke-width="0.36" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="19.2" font-size="6.4" fill="#58734f" font-weight="bold" text-anchor="middle" data-icon-mark="JS">JS</text></svg>