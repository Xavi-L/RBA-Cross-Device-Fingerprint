<marker id="relation-studied" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6.5 L2 11" fill="none" stroke="#bd8b47" stroke-width="2.3" stroke-linejoin="round"/></marker>
