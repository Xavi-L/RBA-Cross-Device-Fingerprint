<marker id="compare-studied" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 2L10 6.5L2 11" stroke="#bd8b47" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker>
