<svg xmlns="http://www.w3.org/2000/svg" width="86mm" height="50mm" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
<title id="title">HybridGuard overview: complementary observations and cross-view consistency</title>
<desc id="desc">Three observation surfaces associated with one App execution form a triangle. Native APIs at left expose device and OS observations; App Web JavaScript at upper right reports webpage-visible properties; the WebView Host at lower right provides container context. The solid blue Native-App Web edge denotes memory and timezone consistency relations used by the current detector. The dashed Host-App Web geometry relation is implemented and evaluated as a separate study, outside the current Full App detector and its candidate pool. The dotted Native-Host edge denotes shared context only, not an independent detection rule. Open arrowheads indicate comparison, not communication or mutual authentication. The App-execution scope does not assert atomic sampling, and no surface is trusted ground truth. Single-view checks, the optional linked Browser, and the complete decision flow are described in the separate system-design figure.</desc>
<style>text {font-family:"Nimbus Roman","Times New Roman",Times,serif} .body{font-size:28px;fill:#343434} .node-title{font-size:31px;font-weight:bold;fill:#343434}</style>

