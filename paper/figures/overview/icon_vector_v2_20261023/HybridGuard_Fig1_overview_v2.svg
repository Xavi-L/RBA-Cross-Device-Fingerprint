  <title id="figure-title">Three complementary views of one Android app execution</title>
  <desc id="figure-description">Compact triangle with Device and OS at left, an in-app webpage at upper right, and its app container at lower right. A thick solid blue double-ended comparison marks memory-bound and timezone relations used by the current detector. A thinner dashed amber comparison marks a separate host-web page-size study. A gray dotted line marks shared execution context only, not a detection rule. App logos are illustrative.</desc>
