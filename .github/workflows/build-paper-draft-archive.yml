name: Build paper draft archive

on:
  push:
    branches:
      - docs/paper-working-package-20260903

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[paper-zip-built]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          ref: docs/paper-working-package-20260903
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="thesis_materials/paper_working_package_20260903"
          OUT="$ROOT/draft/HybridGuard_ACM_Draft_Flattened_Overleaf_20260903.zip"

          cat "$ROOT"/.draft_zip_chunks/part*.b64 | base64 --decode > "$OUT"
          echo "9940c0b0f2d1dd786e294a82513f5977dd086212c5ab01d2602ac533b6404744  $OUT" | sha256sum -c -
          unzip -t "$OUT"
          rm -rf "$ROOT/.draft_zip_chunks"

      - name: Commit verified archive and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="thesis_materials/paper_working_package_20260903"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$ROOT"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(paper): add verified Overleaf draft archive [paper-zip-built]"
          git push origin HEAD:docs/paper-working-package-20260903
