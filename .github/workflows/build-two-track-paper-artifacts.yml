name: Build two-track paper artifacts

on:
  push:
    branches:
      - docs/paper-two-track-evaluation-20260903

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[two-track-built]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          ref: docs/paper-two-track-evaluation-20260903
          fetch-depth: 0

      - name: Reconstruct and verify Overleaf ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="thesis_materials/paper_working_package_20260903"
          ZIP="$ROOT/draft/HybridGuard_ACM_Draft_Flattened_Overleaf_20260903.zip"
          BUILD=".paper_twotrack_build"
          base64 --decode "$ROOT/.twotrack_update_chunks/zip.b64" > "$ZIP"
          echo "6971539f0a911ff0b2e082ece30c96ba20ef5b90b7db22942bdf848a095cf83e  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          unzip -q "$ZIP" -d "$BUILD"

      - name: Compile flattened ACM draft
        uses: xu-cheng/latex-action@v3
        with:
          root_file: hybridguard_draft.tex
          working_directory: .paper_twotrack_build
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit generated PDF and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="thesis_materials/paper_working_package_20260903"
          ZIP="$ROOT/draft/HybridGuard_ACM_Draft_Flattened_Overleaf_20260903.zip"
          PDF="$ROOT/draft/HybridGuard_ACM_Draft_TwoTrack_20260903.pdf"
          cp .paper_twotrack_build/hybridguard_draft.pdf "$PDF"
          test -s "$PDF"
          {
            echo "# Two-track draft artifact hashes"
            echo
            echo "- ZIP SHA-256: \`$(sha256sum "$ZIP" | awk '{print $1}')\`"
            echo "- ZIP size: \`$(stat -c%s "$ZIP")\` bytes"
            echo "- PDF SHA-256: \`$(sha256sum "$PDF" | awk '{print $1}')\`"
            echo "- PDF size: \`$(stat -c%s "$PDF")\` bytes"
          } > "$ROOT/draft/artifact_hashes.md"
          rm -rf "$ROOT/.twotrack_update_chunks" .paper_twotrack_build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$ROOT"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(paper): build two-track PDF and ZIP [two-track-built]"
          git push origin HEAD:docs/paper-two-track-evaluation-20260903
