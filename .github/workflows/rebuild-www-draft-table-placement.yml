name: Rebuild WWW draft after LaTeX layout change

on:
  push:
    branches: [main]
    paths:
      - 'output/pdf/hybridguard_www_draft_20261017/sections/01_introduction.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/sections/02_background_and_scope.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/main.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/tables/table_01.tex'
      - '.github/workflows/rebuild-www-draft-table-placement.yml'
      - 'output/pdf/hybridguard_www_draft_20261017/floats/figure_01.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/floats/figure_02.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/source/migrate_manuscript.py'
      - 'output/pdf/hybridguard_www_draft_20261017/sections/03_method.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/sections/04_evaluation_protocol.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/tables/table_02.tex'
      - 'output/pdf/hybridguard_www_draft_20261017/**/*.tex'

permissions:
  contents: write

concurrency:
  group: rebuild-www-draft-main
  cancel-in-progress: false

jobs:
  compile-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: output/pdf/hybridguard_www_draft_20261017
          fetch-depth: 1
      - name: Build ACM manuscript with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: output/pdf/hybridguard_www_draft_20261017
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Verify related-work Table 1 is in Section 2
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('output/pdf/hybridguard_www_draft_20261017')
          aux=(root/'main.aux').read_text()
          pdf=root/'main.pdf'
          assert pdf.is_file() and pdf.stat().st_size>10000, 'PDF not generated'
          keys=['sec:1','sec:2','sec:3','tab:related','tab:materials','tab:app',
                'tab:specialists','tab:normals','tab:paired',
                'fig:surfaces','fig:pipeline','fig:mechanisms',
                'marker:main-text-end','marker:references-end','marker:appendix-end','TotPages']
          pages={}
          for key in keys:
              lines=[line for line in aux.splitlines() if line.startswith(r'\newlabel{'+key+'}')]
              assert len(lines)==1, f'missing or duplicated label: {key}'
              m=re.search(r'\{\{[^{}]*\}\{([0-9]+)\}',lines[0])
              assert m, f'cannot parse page of {key}: {lines[0]}'
              pages[key]=int(m.group(1))
          print('Layout labels:',pages)
          # Inspect the possible spill pages using the system PDF renderer.
          import subprocess
          for n in (8,9):
              reading = subprocess.run(['pdftotext','-f',str(n),'-l',str(n),
                                        str(pdf),'-'],capture_output=True,text=True,check=True)
              plain = re.sub(r'\s+', ' ', reading.stdout)
              print(f'Page {n}: {len(plain)} text characters')
              print(f'PAGE {n} START:',plain[:1100])
              print(f'PAGE {n} END:',plain[-900:])
          if pages['marker:main-text-end']>8: print('PAGE LIMIT WARNING:',pages['marker:main-text-end'])
          assert pages['tab:related']==pages['sec:2'], (
              f"Table 1 on page {pages['tab:related']}, Section 2 on page {pages['sec:2']}")
          assert pages['tab:related']<=pages['sec:3'], 'Table 1 drifted beyond Section 3'
          tables=[pages[f'tab:{x}'] for x in ['related','materials','app','specialists','normals','paired']]
          assert tables==sorted(tables), 'Table order changed'
          report=root/'qa/table_1_section2_placement_20261024.md'
          report.write_text(
              '# Table 1 placement validation (2026-10-24)\n\n'
              f"- Related Work section (Section 2): PDF page {pages['sec:2']}\n"
              f"- Table 1 (tab:related): PDF page {pages['tab:related']}\n"
              f"- Section 3: PDF page {pages['sec:3']}\n"
              '- All six table labels and all three figure labels resolve.\n'
              '- No table data, caption, figure or experimental text was edited in this placement change.\n'
              '- Compiled from main.tex using pdfLaTeX and latexmk.\n',
              encoding='utf-8')
          for figure,old_width in [('figure_01',0.82),('figure_02',0.90)]:
              src=(root/'floats'/f'{figure}.tex').read_text(encoding='utf-8')
              assert r'\includegraphics[width=\textwidth]' in src
          total=pages.get('TotPages')
          report2=root/'qa/figures_1_2_fullwidth_20261024.md'
          report2.write_text(
              '# Figure 1 and Figure 2 full-width LaTeX trial (2026-10-24)\n\n'
              '- Figure 1: 0.82 -> 1.00 textwidth (1.220x linear scale).\n'
              '- Figure 2: 0.90 -> 1.00 textwidth (1.111x linear scale).\n'
              '- Vector PDF/SVG graphics and captions are unchanged; aspect ratios are preserved.\n'
              f"- Figure 1 page: {pages['fig:surfaces']}\n"
              f"- Figure 2 page: {pages['fig:pipeline']}\n"
              f"- Table 1 page: {pages['tab:related']} (Section 2: {pages['sec:2']})\n"
              f"- Figure 3 page: {pages['fig:mechanisms']}\n"
              f"- Materials Table 2 page: {pages['tab:materials']}\n"
              f"- Main text end page: {pages['marker:main-text-end']}\n"
              f"- References end page: {pages['marker:references-end']}\n"
              f"- Total PDF pages: {pages['TotPages']}\n"
              '- All six tables and three figures resolve in LaTeX references.\n',
              encoding='utf-8')
          # Verify the compact Table 2 still includes all original count rows.
          compact=(root/'tables/table_02.tex').read_text(encoding='utf-8')
          assert r'\begin{table}[t]' in compact
          assert r'\begin{tabularx}{\columnwidth}' in compact
          checks=['App & 126 & 252','Discovery & --- & 630',
                  'Historical development & --- & 144',
                  'Historically reserved & --- & 117',
                  'Memory & 18 & 48','Timezone & 6 & 30',
                  'Geometry & 6 & 66','App--Browser & 14 & 46']
          assert all(x in compact for x in checks)
          (root/'qa/table2_compact_review_20261024.md').write_text(
              '# Table 2 single-column publication check\n\n'
              '- Preserved all eight material rows, numeric counts, and study roles; expanded the caption and footnote to clarify denominators and normal-position accounting.\n'
              '- Four grouped material categories, four table columns, single-column ACM float.\n'
              f"- Table 2 PDF page: {pages['tab:materials']}\n"
              f"- Main text last page: {pages['marker:main-text-end']}\n"
              f"- Total PDF pages: {pages['TotPages']}\n"
              f"- Figure 1 / 2 / 3 pages: {pages['fig:surfaces']} / {pages['fig:pipeline']} / {pages['fig:mechanisms']}\n"
              '- Visually reviewed initial trial on isolated layout branch; no overfull warnings.\n',
              encoding='utf-8')
          (root/'HybridGuard_WWW_Draft.pdf').write_bytes(pdf.read_bytes())
          PY
      - name: Check figure and table proximity
        shell: bash
        run: |
          set -euo pipefail
          python3 output/pdf/hybridguard_www_draft_20261017/qa/check_float_proximity.py
      - name: Synchronize all current LaTeX sources and verify compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, zipfile

          root = Path('output/pdf/hybridguard_www_draft_20261017')
          outpdf = root / 'HybridGuard_WWW_Draft.pdf'
          assert outpdf.stat().st_size > 30000
          aux = (root / 'main.aux').read_text()
          def page_of(label):
              rows = [line for line in aux.splitlines()
                      if line.startswith(r'\newlabel{' + label + '}')]
              assert len(rows) == 1, (label, len(rows))
              match = re.search(r'\{\{[^{}]*\}\{([0-9]+)\}', rows[0])
              assert match, (label, rows[0])
              return int(match.group(1))
          body_end = page_of('marker:main-text-end')
          total = page_of('TotPages')
          if body_end > 8: print('PAGE LIMIT WARNING:',body_end)
          import subprocess
          collected = re.sub(r'\s+', ' ', subprocess.check_output(
              ['pdftotext',str(outpdf),'-'],text=True)).lower()
          for phrase in ('historical-normal decision counts by cohort',
                         'fingerprint attributes',
                         'asynchronous legitimate timezone changes remain'):
              assert phrase in collected, f'New text absent from PDF: {phrase}'
          subprocess.run(['pdftoppm','-f','1','-l','1','-scale-to','650',
                          '-png','-singlefile',str(outpdf),'/tmp/hybridguard-page1'],
                         check=True,stdout=subprocess.DEVNULL)
          assert Path('/tmp/hybridguard-page1.png').stat().st_size > 10000

          logfile = (root / 'main.log').read_text(errors='replace')
          assert 'There were undefined references' not in logfile
          overfull = len(re.findall(r'Overfull \\[hv]box', logfile))

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          heading = '## 当前版本：2026-10-25 全量 LaTeX 重新编译'
          if heading not in readme:
              summary = ('\n\n' + heading + '\n\n'
                  '以 main 分支最新 main.tex 编译；保留已定稿图表，不运行历史迁移。\n'
                  f'- 正文结束在第 {body_end} 页；全文 {total} 页。\n'
                  '- 当前 PDF 与 Overleaf ZIP 的所有 LaTeX、参考文献及图表源同步。\n'
                  '- 编译验证记录：qa/current_compilation_20261025.md。\n')
              pos = readme.index('\n')
              readme_path.write_text(readme[:pos+1] + summary + readme[pos+1:],
                                     encoding='utf-8')

          archive_path = root / 'HybridGuard_WWW_Overleaf.zip'
          manifest_path = root / 'qa/package_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          known = set(manifest['files'])
          with zipfile.ZipFile(archive_path) as archive:
              entries = [(item, archive.read(item.filename))
                         for item in archive.infolist()]
          def find_rel(name):
              matches = [rel for rel in known
                         if name == rel or name.endswith('/' + rel)]
              return max(matches, key=len) if matches else None

          replacements = {}
          members = []
          for info, saved_data in entries:
              rel = find_rel(info.filename)
              if rel is None:
                  if info.filename.endswith('qa/package_manifest.json'):
                      members.append((info, None))
                      continue
                  assert info.is_dir() or not info.filename.endswith('.tex'), (
                      'Unknown TeX member: ' + info.filename)
                  members.append((info, saved_data))
                  continue
              live = root / rel
              assert live.is_file(), ('Missing source: ' + rel)
              assert rel not in replacements, ('Duplicated member: ' + rel)
              replacements[rel] = live.read_bytes()
              members.append((info, replacements[rel]))
          assert known == set(replacements), (
              'ZIP manifest mismatch: ' + str(sorted(known - set(replacements))))
          required_tex = {p.relative_to(root).as_posix()
                          for tree in ('sections', 'tables', 'floats')
                          for p in (root / tree).glob('*.tex')}
          required_tex.update(['main.tex','main_matrix.tex','frontmatter.tex','table_visuals.tex'])
          assert required_tex.issubset(replacements), (
              'Current TeX missing from ZIP: ' + str(sorted(required_tex - set(replacements))))

          def digest(data):
              return hashlib.sha256(data).hexdigest()
          manifest['date'] = '2026-10-25'
          manifest['files'] = {rel: {'sha256':digest(data),'bytes':len(data)}
                               for rel, data in sorted(replacements.items())}
          manifest_bytes = (json.dumps(manifest,ensure_ascii=False,indent=2)
                            + '\n').encode('utf-8')
          manifest_path.write_bytes(manifest_bytes)
          rebuilt = archive_path.with_suffix('.new.zip')
          manifest_written = False
          with zipfile.ZipFile(rebuilt,'w') as archive:
              for info, data in members:
                  if data is None:
                      data = manifest_bytes
                      manifest_written = True
                  archive.writestr(info, data)
          assert manifest_written, 'Manifest was absent from Overleaf ZIP'
          with zipfile.ZipFile(rebuilt) as archive:
              assert archive.testzip() is None
              for info in archive.infolist():
                  rel = find_rel(info.filename)
                  if rel in required_tex:
                      assert archive.read(info.filename) == (root / rel).read_bytes(), rel
          os.replace(rebuilt, archive_path)

          doc = ('# WWW draft compiled from current LaTeX, 2026-10-25\n\n'
                 '- Entry: main.tex; historical migration: not run.\n'
                 f'- Main text end: PDF page {body_end}; total {total} pages.\n'
                 f'- LaTeX files synchronized in Overleaf ZIP: {len(required_tex)}.\n'
                 f'- Total archived source files synchronized: {len(replacements)}.\n'
                 f'- Overfull box warnings: {overfull}.\n'
                 f'- PDF SHA-256: {digest(outpdf.read_bytes())}.\n'
                 f'- ZIP SHA-256: {digest(archive_path.read_bytes())}.\n')
          (root / 'qa/current_compilation_20261025.md').write_text(
              doc,encoding='utf-8')
          print(doc)
          PY
      - name: Commit refreshed PDF, source ZIP, and placement report
        shell: bash
        run: |
          set -euo pipefail
          ROOT=output/pdf/hybridguard_www_draft_20261017
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/HybridGuard_WWW_Draft.pdf" "$ROOT/HybridGuard_WWW_Overleaf.zip" "$ROOT/qa/table_1_section2_placement_20261024.md" "$ROOT/qa/figures_1_2_fullwidth_20261024.md" "$ROOT/qa/table2_compact_review_20261024.md" "$ROOT/qa/package_manifest.json" "$ROOT/qa/current_compilation_20261025.md" "$ROOT/qa/float_proximity_20261025.md" "$ROOT/README.md"
          if ! git diff --cached --quiet; then
            git commit -m "docs(paper): compile latest LaTeX and synchronize PDF with Overleaf ZIP [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
