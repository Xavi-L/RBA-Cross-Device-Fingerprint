<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HybridGuard Expanded Probe</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --panel: #ffffff;
            --text: #101828;
            --muted: #667085;
            --accent: #1a73e8;
            --good: #12805c;
            --bad: #c5221f;
            --border: #d0d5dd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: max(56px, calc(env(safe-area-inset-top) + 28px)) 18px 28px;
            color: var(--text);
            background: var(--bg);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .pulse {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.35);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            to { box-shadow: 0 0 0 12px rgba(26, 115, 232, 0); }
        }

        h1 {
            margin: 0;
            font-size: 17px;
            line-height: 1.25;
        }

        .sub {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .status {
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }

        .canvas-box {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
        }

        .log {
            height: 320px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.55;
        }

        .line {
            margin: 0 0 7px;
            color: var(--text);
        }

        .line.good { color: var(--good); }
        .line.bad { color: var(--bad); }
    </style>
</head>
<body>
<div class="header">
    <div class="pulse"></div>
    <div>
        <h1>Expanded Feature Probe</h1>
        <div id="subtitle" class="sub">Collecting raw signals for offline grouped-fusion experiments.</div>
    </div>
</div>

<div class="panel">
    <div id="status" class="status">Starting expanded probe...</div>
    <div id="canvasBox" class="canvas-box"></div>
</div>

<div class="panel log" id="log"></div>

<!-- canonical_web_probe.js is sourced from the repository-level web_probe directory by Gradle. -->
<script src="canonical_web_probe.js"></script>
<script src="expanded_webview_adapter.js"></script>
</body>
</html>
