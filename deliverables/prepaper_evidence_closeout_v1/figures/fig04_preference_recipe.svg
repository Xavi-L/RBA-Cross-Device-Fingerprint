  <g id="text_38">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(281.671875 289.762187)">P0 REL uses Browser list length &lt;= 2.5. This is recipe dependence, not identification of arbitrary manipulation intent.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(338.70625 300.96)">T = alert, F = no alert. These exposed samples retain their plan-specific training/holdout roles.</text>
