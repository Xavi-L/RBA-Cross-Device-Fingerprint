# HTTP is only for ACME. Keep collection traffic on HTTPS.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "HTTPS collection domain is not configured yet.\n";
    }
}
