# Installed as /etc/nginx/snippets/hybridguard-ngrok.conf.
# The public Host must still reach ngrok for tunnel routing. The ngrok
# traffic policy then rewrites Host to the collection domain for FastAPI.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host hemispheric-overmoist-candance.ngrok-free.dev;
proxy_set_header ngrok-skip-browser-warning 1;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-For "";
proxy_set_header Forwarded "";
proxy_ssl_server_name on;
proxy_ssl_name hemispheric-overmoist-candance.ngrok-free.dev;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_connect_timeout 15s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
proxy_next_upstream off;
proxy_cache off;
# 127.0.0.53 is Ubuntu's verified local systemd-resolved listener.
resolver 127.0.0.53 valid=60s ipv6=off;
set $hg_ngrok hemispheric-overmoist-candance.ngrok-free.dev;
proxy_pass https://$hg_ngrok$request_uri;
