# Deployed after certificate issuance; keep HTTP only for ACME and redirection.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://collect.crossdevicefingerprint.site$request_uri; }
}
